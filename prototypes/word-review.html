<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word 交付审阅｜OpenKB 原型</title>
<style>
:root {
  color-scheme:light;
  --ink:#0f172a;
  --muted:#475569;
  --line:#dbe4ee;
  --accent:#1e3a5f;
  --soft:#edf4ff;
  --paper:#f7f9fc;
  --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}
main,.header-inner{max-width:1248px;margin:auto;padding-inline:28px}
header{border-bottom:1px solid var(--line);background:var(--white)}
.header-inner{min-height:66px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:750;font-size:1.15rem}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;background:var(--accent);border-radius:7px;color:white;font-weight:750;font-size:1rem}
.badge{background:#eef3f9;color:var(--accent);padding:3px 9px;border-radius:5px;font-size:.81rem;font-weight:650}
main{padding-block:30px 48px}
h1,h2,h3,p,dl,ol,ul,blockquote{margin-top:0}
h1{font-size:clamp(1.95rem,4.6vw,2.9rem);letter-spacing:-.045em;line-height:1.15;margin-bottom:9px}
h2{font-size:1.2rem;margin-bottom:12px;line-height:1.35}
h3{font-size:1rem;margin-bottom:4px}
p{margin-bottom:12px}
.intro{max-width:74ch;color:var(--muted);margin-bottom:20px}
.graph-panel{
  --graph-border:#425778;--graph-line:#8199bf;
  padding:20px 22px 22px;margin-bottom:20px;border-radius:13px;color:#f5f8ff;
  background-color:#142640;
  background-image:radial-gradient(circle at 1px 1px,#b2c3e42b 1px,transparent 0);
  background-size:16px 16px;
}
.graph-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;margin-bottom:14px}
.graph-heading h2{margin:0}
.graph-heading p{margin:0;color:#c5d4eb;font-size:.87rem}
.flow-graph{
  display:grid;
  grid-template-columns:minmax(0,1fr) 33px minmax(0,1.1fr) 33px minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1.08fr);
  grid-template-rows:repeat(2,minmax(56px,1fr));row-gap:14px;align-items:center
}
.flow-node{
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;
  width:100%;min-height:56px;padding:8px 10px;line-height:1.4;text-align:left;
  background:#203756;color:#f3f7ff;border:1px solid #52688b;border-radius:8px
}
.flow-node:not(:disabled):hover{color:white;background:#304e78;border-color:#93b8f3}
.flow-node strong{display:block;font-size:.91rem}
.flow-node small{display:block;margin-top:2px;color:#c9d8ee;font-size:.77rem}
.flow-node:disabled{cursor:default;background:#192e4a;color:#d4dfef;border-color:#3e5777}
.flow-node:disabled small{color:#b8c9de}
.flow-node.active{background:#254577;border-color:#b2caff;box-shadow:inset 0 0 0 1px #9bbcff}
.flow-node.waiting:not(:disabled){background:#3e3527;border-color:#d8b877}
.flow-node.waiting small{color:#ffe4aa}
.flow-node:focus-visible{outline-color:#c7dcff}
.node-mark{width:10px;height:10px;border:1px solid #9eb6d9;border-radius:50%;background:#192d49}
.done .node-mark{border-color:#93debc;background:#93debc}
.active .node-mark{border-color:#c1d6ff;background:#a6c8ff}
.waiting .node-mark{border-color:#ffdaa0;background:#ffdaa0}
.flow-intake{grid-column:1;grid-row:1 / 3}
.flow-scope{grid-column:3;grid-row:1}
.flow-table{grid-column:3;grid-row:2}
.flow-answer{grid-column:5;grid-row:1 / 3}
.flow-decision{grid-column:7;grid-row:1 / 3}
.flow-review{grid-column:9;grid-row:1 / 3}
.edge{position:relative;align-self:stretch;grid-row:1 / 3;color:var(--graph-line);pointer-events:none}
.edge-split{grid-column:2}
.edge-merge{grid-column:4}
.edge-decision{grid-column:6}
.edge-review{grid-column:8}
.edge::before,.edge::after,.edge i::before,.edge i::after{content:"";position:absolute;background:currentColor}
.edge::before{top:50%;height:1px;left:0;right:0}
.edge-split::before{right:50%}
.edge-merge::before{left:50%}
.edge-split::after,.edge-merge::after{top:calc(25% - 3.5px);bottom:calc(25% - 3.5px);left:50%;width:1px}
.edge-split i::before,.edge-split i::after,.edge-merge i::before,.edge-merge i::after{height:1px}
.edge-split i::before,.edge-split i::after{left:50%;right:0}
.edge-merge i::before,.edge-merge i::after{left:0;right:50%}
.edge-split i::before,.edge-merge i::before{top:calc(25% - 3.5px)}
.edge-split i::after,.edge-merge i::after{bottom:calc(25% - 3.5px)}
.edge-decision::after,.edge-review::after{top:calc(50% - 3px);right:2px;width:6px;height:6px;background:transparent;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.layout{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px;min-width:0}
.now{border-left:4px solid #2563eb}
.now h2{margin-bottom:4px}
.now p:last-child,.panel > :last-child{margin-bottom:0}
.message:empty{display:none}
.message{background:var(--soft);color:var(--ink);border-radius:6px;padding:9px 14px;margin-bottom:12px}
button,input,textarea{font:inherit}
button{min-height:44px;background:var(--white);color:var(--ink);border:1px solid #a8b8cb;border-radius:6px;padding:8px 12px;font-weight:650;cursor:pointer}
button:hover{border-color:var(--accent);background:var(--soft)}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover{background:#284b79;color:white}
:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
textarea,input{width:100%;border:1px solid #a8b8cb;border-radius:6px;padding:9px 11px;color:var(--ink);background:white}
textarea{min-height:82px;resize:vertical}
label{display:block;font-weight:650;margin-bottom:5px}
small,.muted,.help{color:var(--muted)}
.help{display:block;margin:4px 0 10px;font-size:.88rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:5px 9px;font-size:.86rem}
[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.step{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.claim{padding-top:12px;margin-top:12px;border-top:1px solid var(--line);scroll-margin:18px}
details{margin-top:9px;scroll-margin:18px}
summary{cursor:pointer;color:var(--accent);font-weight:650;padding:4px 0}
.trace{padding-left:21px;margin:8px 0}
.trace li{padding:4px 0;overflow-wrap:anywhere}
blockquote{border-left:3px solid #517cbd;background:var(--soft);padding:8px 12px;margin:5px 0}
.sources,.events,.history{padding-left:20px;margin-bottom:8px}
.sources li,.events li,.history li{margin:5px 0;overflow-wrap:anywhere}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare>div{border:1px solid var(--line);border-radius:6px;padding:10px}
.status,a{color:var(--accent);font-weight:700}
form>.actions{margin-top:10px}
[id$="-panel"]{scroll-margin:18px}
@media(max-width:980px){
  .flow-graph{grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr)}
  .flow-node{gap:7px;padding-inline:7px}
}
@media(max-width:720px){
  main,.header-inner{padding-inline:16px}
  main{padding-block:24px 36px}
  .layout{grid-template-columns:1fr;gap:12px}
  .graph-panel{padding:15px}
  .graph-heading{margin-bottom:10px}
  .flow-graph{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,auto);gap:10px;position:relative}
  .flow-graph::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:var(--graph-line)}
  .edge{display:none}
  .flow-node{min-height:46px;z-index:0;padding:5px 9px;align-content:center}
  .flow-intake,.flow-answer,.flow-decision,.flow-review{grid-column:1 / 3}
  .flow-intake{grid-row:1}
  .flow-scope{grid-row:2;grid-column:1}
  .flow-table{grid-row:2;grid-column:2}
  .flow-answer{grid-row:3}
  .flow-decision{grid-row:4}
  .flow-review{grid-row:5}
}
@media(max-width:480px){.panel{padding:14px}.compare{grid-template-columns:1fr}}

</style>
</head>
<body>
<header><div class="header-inner"><span class="brand"><span class="brand-mark" aria-hidden="true">O</span>OpenKB</span><span class="badge">交互原型 · 固定数据</span></div></header>
<main>
  <h1>Word 交付审阅</h1>
  <p class="intro">把交付审阅交给 Super Agent，核对结论和原文，再由你确认决定。</p>
  <section class="graph-panel" aria-labelledby="workflow-title">
    <div class="graph-heading">
      <h2 id="workflow-title">审阅流程</h2>
      <p>点击可用节点，查看这一步的结果与依据。</p>
    </div>
    <div id="workflow-nodes" class="flow-graph"></div>
  </section>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <div class="layout">
    <div id="workspace"></div>
    <aside id="sidebar" aria-label="演练和工作记录"></aside>
  </div>
</main>

<script>
const reviewDemo = (() => {
  const question = "这份非网页 Word 有一张单页数据表和一张跨页数据表，两张都没设置重复表头。哪些要改？需要检查 Bypass Blocks 吗？请给我依据。";
  const scope = {
    file: "508-applicability-checklist.docx", version: "官方原件 v1",
    block: "第 71 段 · 2.4.1 Bypass Blocks",
    quote: "2.4.1 Bypass Blocks (not required for non-web documents and software)",
    claim: "非网页文档无需检查 Bypass Blocks。"
  };
  const word = {
    base: {
      file: "508-word-checklist.docx", version: "官方原件 v1", block: "第 9 张表，第 4 行 · Data Tables",
      quote: "Tables repeat their header row.", claim: "数据表格需要设置重复表头。"
    },
    material: {
      file: "section508-word-SIMULATED-REVISION.docx", version: "模拟新版 v2", block: "第 9 张表，第 4 行 · Data Tables",
      quote: "Only data tables that span multiple pages must repeat their header row.", claim: "只有跨页数据表格需要设置重复表头。"
    },
    wording: {
      file: "Word 检查表 · 仅改措辞.docx", version: "模拟新版 v2", block: "第 9 张表，第 4 行 · Data Tables",
      quote: "Data tables must repeat their header rows.", claim: "数据表格需要设置重复表头。"
    },
    removed: {
      file: "Word 检查表 · 依据删除.docx", version: "模拟新版 v2", block: "第 9 张表，第 4 行 · 旧依据已删除",
      quote: null, claim: "新版缺少支持原表头要求的依据。"
    }
  };
  const scenarios = {
    material: {
      label: "规则变化", description: "先记录决定，导入新版后观察系统会把哪项交给你复核。",
      steps: [["ask","提交审阅"],["inspect","看表格证据"],["record","记录退回决定"],["import","导入模拟新版"],["inspect-impact","查看变更影响"],["confirm","确认调整决定"]]
    },
    missing: {
      label: "缺少依据", description: "先缺少 Word 检查表，看看系统能回答哪些问题，以及补齐后从哪里继续。",
      steps: [["ask","提交审阅"],["supply","补充 Word 检查表"],["inspect","查看补齐后的依据"],["record","记录退回决定"]]
    },
    wording: {
      label: "仅改措辞", description: "观察结论仍成立时，系统怎样记录复核，以及重复导入是否增加待办。",
      steps: [["ask","提交审阅"],["record","记录退回决定"],["import","导入措辞新版"],["import","重复导入同一新版"]]
    },
    removed: {
      label: "依据消失", description: "原文失去支持后，观察系统如何保留旧决定，并把缺口交给人。",
      steps: [["ask","提交审阅"],["record","记录退回决定"],["import","导入删除依据的新版"],["inspect-impact","查看缺失的依据"]]
    }
  };
  const create = scenario => ({
    scenario, step: 0, request: "", documents: scenario !== "missing", decisions: [], revision: null,
    review: null, events: [], notice: ""
  });
  function outcome(state, change, notice, event) {
    return {...state, ...change, notice, events: event ? [...state.events, event] : state.events};
  }
  function send(state, action, value = "") {
    switch (action) {
      case "ask":
        if (state.request) return outcome(state, {}, "这条委托已提交。");
        return outcome(state, {request: value.trim() || question},
          state.documents ? "已核对两份资料，可以查看审阅建议。" : "已核对适用范围，表头要求还缺一份资料。",
          state.documents ? "已分别查证适用范围和 Word 表格规则。" : "已查证适用范围，发现表头依据缺失。");
      case "inspect":
        return outcome(state, {}, state.request ? "已展开表格结论的溯源。" : "先提交审阅委托。");
      case "supply":
        if (state.documents) return outcome(state, {}, "Word 检查表已经可用。");
        return outcome(state, {documents:true}, "已补充检查表，继续同一条委托并完成表头查证。",
          "补充 Word 检查表后复用已核对的适用性结论。");
      case "record":
        if (!state.request || !state.documents) return outcome(state, {}, "先完成两项查证，再记录该场景的决定。");
        if (state.decisions.length) return outcome(state, {}, "原决定已记录。可在历史查看当时的依据。");
        return outcome(state, {decisions:[{
          title:"退回修改：两张表补设重复表头", reason:value.trim() || "两张数据表都未设置重复表头，规则要求补设。",
          source:word.base, scope
        }]}, "已记录人工决定及当时的依据。", "审阅员记录退回修改。");
      case "import": {
        if (!state.decisions.length) return outcome(state, {}, "演练先记录原决定，再导入新版。");
        const revision = state.scenario === "wording" || state.scenario === "removed" ? state.scenario : "material";
        if (state.revision) return outcome(state, {}, "这份新版已入库。原复核记录保留，待办数量未增加。");
        const review = revision === "wording" ? "unchanged" : "pending";
        return outcome(state, {revision, review}, review === "pending" ?
          "新版已入库。系统已发起复核，找到 1 项待你确认的决定。" :
          "系统已自动复核。表头要求的含义一致，原决定继续有效。",
          "新版入库后沿表格规则反查到原回答和人工决定。");
      }
      case "inspect-impact":
        return outcome(state, {}, state.review ? "已展开从变更原文到人工决定的影响路径。" : "先导入模拟新版。");
      case "confirm":
      case "keep": {
        if (state.review !== "pending") return outcome(state, {}, "当前没有待人工确认的决定。");
        if (action === "confirm" && state.revision === "removed") {
          return outcome(state, {}, "新版缺少依据，无法确认规则是否改变。可以人工记录保留原决定。");
        }
        const keepsOriginal = action === "keep";
        const decision = {
          title: keepsOriginal ? "人工确认：保留原决定" : "调整决定：只要求跨页表补设重复表头",
          reason: value.trim() || (keepsOriginal ? "经人工核对，保留原决定。" : "模拟新版把适用范围限定为跨页表。"),
          source: keepsOriginal ? word.base : word[state.revision], scope
        };
        return outcome(state, {review:"confirmed", decisions:[...state.decisions, decision]},
          "人工确认完成。历史决定和当时的依据仍可查看。", "审阅员对受影响决定作出人工确认。");
      }
      default:
        return state;
    }
  }
  return {question, scope, word, scenarios, create, send};
})();
</script>

<script>
const {question, scope, word, scenarios, create, send} = reviewDemo;
const workspace = document.getElementById("workspace");
const sidebar = document.getElementById("sidebar");
const message = document.getElementById("message");
let state = create("material");
let opened = "";
const esc = value => String(value).replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
})[char]);
const button = (action, title, primary=false) =>
  '<button type="button" data-action="' + action + '"' + (primary ? ' class="primary"' : '') + '>' + title + '</button>';
const trace = (id, finding, source) =>
  '<details id="' + id + '"><summary>查看原文与溯源</summary><ol class="trace">' +
  '<li><strong>回答结论</strong> · ' + esc(finding) + '</li>' +
  '<li><strong>声明</strong> · ' + esc(source.claim) + '</li>' +
  '<li><strong>证据</strong><blockquote lang="en">' + esc(source.quote) + '</blockquote></li>' +
  '<li><strong>原文块</strong> · ' + esc(source.block) + '</li>' +
  '<li><strong>资料版本</strong> · ' + esc(source.file) + ' · ' + esc(source.version) + '</li></ol></details>';

function current() {
  if (state.review === "pending") return ["待你确认 · 1 项","打开复核，核对哪段原文变了，再决定是否调整原决定。"];
  if (state.review === "unchanged") return ["已复核 · 0 项待确认","原结论仍成立。可以查看新旧原文和历史决定。"];
  if (state.review === "confirmed") return ["人工确认完成","可以回看原决定及这次确认。"];
  if (state.decisions.length) return ["已记录人工决定","导入模拟新版，观察系统如何主动复核。"];
  if (state.request && !state.documents) return ["等待补充 · 缺少 Word 检查表","适用范围已查证。补充规则资料后会继续同一条委托。"];
  if (state.request) return ["审阅建议已就绪","查看两项结论的依据，再记录你的决定。"];
  return ["提交交付审阅","用现有示例问题发起委托，查看 Super Agent 查到了什么。"];
}

function renderAnswer() {
  if (!state.request) return '<section id="ask-panel" class="panel" tabindex="-1"><h2>问知识库</h2><form data-form="ask">' +
    '<label for="question">你想审阅什么？</label><textarea id="question" name="value" required>' + esc(question) +
    '</textarea><small class="help">此原型用固定的 Word 场景演示，其他提问仍显示这组样例。</small>' +
    '<button class="primary" type="submit">提交审阅</button></form></section>';
  const scopeFinding = "这个非网页 Word 交付件无需检查 Bypass Blocks。";
  const tableFinding = "按当时采用的规则，单页表和跨页表都需要补设重复表头。";
  return '<section id="answer-panel" class="panel" tabindex="-1"><h2>' + (state.revision ? '原审阅建议 · 依据 v1' : '审阅建议') + '</h2><p class="muted">委托 · ' + esc(state.request) +
    '</p><p><strong>用户提供的情况</strong> · 两张数据表都未设置重复表头。此演示未检查交付原件。</p>' +
    '<div class="claim"><h3>适用性 · 无需检查 Bypass Blocks</h3>' + trace("scope-trace", scopeFinding, scope) + '</div>' +
    '<div id="table-finding" class="claim" tabindex="-1"><h3>数据表格 · ' + (state.documents ? '两张都需补设' : '依据不足') + '</h3>' +
    (state.documents ? trace("table-trace", tableFinding, word.base) :
      '<p>当前缺少 Word 检查表，先保留这项判断。</p>' + button("supply","补充 Word 检查表",true)) + '</div></section>';
}
function renderDecision() {
  if (!state.request || !state.documents) return "";
  if (!state.decisions.length) return '<section id="decision-panel" class="panel" tabindex="-1"><h2>记录人工决定</h2><p>示例建议退回修改，由你确认是否记录。</p>' +
    '<form data-form="record"><label for="reason">决定理由</label><input id="reason" name="value" value="两张数据表都未设置重复表头，需要补设。">' +
    '<div class="actions"><button class="primary" type="submit">记录退回决定</button></div></form></section>';
  const list = state.decisions.map((decision,index) => '<li><strong>' + esc(decision.title) +
    '</strong><p>' + esc(decision.reason) + '</p><details><summary>查看当时的两份依据</summary>' +
    trace("decision-rule-"+index, decision.source.claim, decision.source) +
    trace("decision-scope-"+index, scope.claim, decision.scope) + '</details></li>').join("");
  return '<section id="decision-panel" class="panel" tabindex="-1"><h2>决定历史</h2><ol class="history">' + list + '</ol></section>';
}
function renderReview() {
  if (!state.review) return "";
  const newer = word[state.revision];
  const heading = state.review === "pending" ? "待人工确认" : state.review === "unchanged" ? "结论未变" : "已人工确认";
  const explanation = state.revision === "wording" ? "新版改了措辞，表头要求仍适用于两张表。" :
    state.revision === "removed" ? "新版删除了原表头依据。需要人核对，原决定已保留。" :
    "新版将表头要求收窄到跨页表格。单页表的处理建议发生变化，跨页表仍需补设。";
  const impact = '<details id="impact"><summary>查看变更影响与新旧原文</summary><ol class="trace">' +
    '<li><strong>变更原文</strong> · ' + esc(newer.file) + ' · ' + esc(newer.block) + '</li>' +
    '<li><strong>受影响声明</strong> · 数据表格需要设置重复表头。</li>' +
    '<li><strong>原回答</strong> · 单页表和跨页表都需要补设。</li>' +
    '<li><strong>人工决定</strong> · ' + esc(state.decisions[0].title) + '</li></ol>' +
    '<div class="compare"><div><h3>当时依据</h3><blockquote lang="en">' + esc(word.base.quote) +
    '</blockquote></div><div><h3>新版依据</h3>' + (newer.quote ?
      '<blockquote lang="en">' + esc(newer.quote) + '</blockquote>' :
      '<p>新版没有对应的重复表头规则。</p>') + '</div></div></details>';
  const choose = state.review === "pending" ?
    '<form data-form="confirm"><p><label for="review-reason">本次确认理由（可选）</label><input id="review-reason" name="value"></p><div class="actions">' +
    (state.revision === "removed" ? '' : '<button class="primary" type="submit" value="confirm">确认调整决定</button>') +
    '<button type="submit" value="keep">保留原决定</button></div></form>' : "";
  return '<section id="review-panel" class="panel" tabindex="-1"><h2>系统发起的复核 · ' + heading + '</h2><p>' +
    explanation + '</p>' + impact + choose + '</section>';
}
function renderSidebar() {
  const scenario = scenarios[state.scenario];
  const next = scenario.steps[state.step];
  const list = '<ul class="sources"><li>' + esc(scope.file) + ' · 官方原件 v1</li>' +
    '<li>' + esc(word.base.file) + ' · ' + (state.documents ? '官方原件 v1' : '待补充') + '</li>' +
    (state.revision ? '<li>' + esc(word[state.revision].file) + ' · ' + esc(word[state.revision].version) + '</li>' : '') + '</ul>';
  sidebar.innerHTML = '<section class="panel"><h2>按场景试用</h2><div class="tabs" role="group" aria-label="演练场景">' +
    Object.entries(scenarios).map(([id,item]) => '<button type="button" data-scenario="' + id + '" aria-pressed="' +
      (state.scenario === id) + '">' + item.label + '</button>').join("") +
    '</div><p>' + scenario.description + '</p><div class="step">' + (next ?
    '<small class="help">第 ' + (state.step+1) + ' 步，共 ' + scenario.steps.length + ' 步</small><button class="primary" type="button" data-guide>' +
    next[1] + '</button>' : '<p class="status">演练完成</p>') + '</div></section>' +
    '<section id="sources-panel" class="panel" tabindex="-1"><h2>本次资料</h2>' + list +
    (state.decisions.length ? button("import",state.revision ? "再次导入同一新版" : "导入模拟新版") : "") +
    '<details><summary>查看 Super Agent 的行动</summary>' + (state.events.length ?
      '<ol class="events">' + state.events.map(event => '<li>' + esc(event) + '</li>').join("") + '</ol>' :
      '<p class="muted">提交委托后，此处会显示关键查证行动。</p>') + '</details>' +
    '<details><summary>自由试用</summary><p class="muted">选择任意操作，看看当前状态允许什么。</p><div class="actions">' +
    [["ask","提交审阅"],["supply","补充资料"],["inspect","看表格证据"],["record","记录退回"],["import","导入新版"],["inspect-impact","看影响"],["confirm","确认调整"],["keep","保留原决定"]]
      .map(([action,title])=>button(action,title)).join("") +
    '</div></details></section>';
}
function renderGraph() {
  const asked = Boolean(state.request);
  const checked = asked && state.documents;
  const recorded = state.decisions.length > 0;
  const now = state.review === "pending" ? "review" : !asked ? "intake" : !checked ? "table" : !recorded ? "decision" : !state.revision ? "review" : "";
  const nodes = [
    ["intake", "提交委托", asked ? "已提交" : "待提交", asked ? "answer-panel" : "ask-panel", asked ? "done" : ""],
    ["scope", "核对适用范围", asked ? "已查证" : "待查证", asked ? "scope-trace" : "", asked ? "done" : ""],
    ["table", "核对表头规则", checked ? "已查证" : asked ? "依据不足" : "待查证",
      checked ? "table-trace" : asked ? "table-finding" : "", checked ? "done" : asked ? "waiting" : ""],
    ["answer", "查看审阅结论", checked ? "建议已就绪" : asked ? "部分有依据" : "待形成",
      asked ? "answer-panel" : "", checked ? "done" : asked ? "waiting" : ""],
    ["decision", "记录人工决定", recorded ? "已记录" : checked ? "待确认" : "待审阅",
      checked ? "decision-panel" : "", recorded ? "done" : ""],
    ["review", "新版主动复核", state.review === "pending" ? "待你确认" : state.review === "confirmed" ? "已确认" :
      state.review === "unchanged" ? "结论未变" : "等待新版",
      state.review ? "review-panel" : recorded ? "sources-panel" : "",
      state.review === "pending" ? "waiting" : state.review ? "done" : ""]
  ];
  document.getElementById("workflow-nodes").innerHTML = nodes.map(([key, title, status, target, tone]) =>
    '<button type="button" class="flow-node flow-' + key + ' ' + tone + (now === key ? ' active' : '') +
    '" data-target="' + target + '"' + (target ? '' : ' disabled') +
    (now === key ? ' aria-current="step"' : '') +
    '><span class="node-mark" aria-hidden="true"></span><span><strong>' + title + '</strong><small>' +
    status + '</small></span></button>').join("") +
    ["split","merge","decision","review"].map(edge => '<span class="edge edge-' + edge + '" aria-hidden="true"><i></i></span>').join("");
}

function render() {
  const [title, next] = current();
  message.textContent = state.notice;
  workspace.innerHTML = '<section class="panel now"><h2 id="current-status" tabindex="-1">' + title + '</h2><p>' +
    next + '</p>' + (state.review === 'pending' ? '<a href="#review-panel">打开待复核事项</a>' : '') +
    '</section>' + renderReview() + renderAnswer() + renderDecision();
  renderSidebar();
  renderGraph();
  if (opened) {
    const target = document.getElementById(opened);
    if (target) {
      target.open = true;
      target.querySelector("summary").focus();
    }
    opened = "";
  }
}
function act(action, value, focus=true) {
  const scenario = scenarios[state.scenario];
  const step = scenario.steps[state.step];
  const attempt = send(state, action, value);
  const completed = {
    ask: !!attempt.request, supply: attempt.documents && !!attempt.request, inspect: attempt.documents && !!attempt.request,
    record: attempt.decisions.length > 0, import: !!attempt.revision, "inspect-impact": !!attempt.review,
    confirm: attempt.review === "confirmed"
  };
  state = {...attempt, step: step && step[0] === action && completed[action] ? state.step + 1 : state.step};
  if (action === "inspect") opened = "table-trace";
  if (action === "inspect-impact") opened = "impact";
  const focusTrace = opened && (action === "inspect" ? completed.inspect : completed["inspect-impact"]);
  render();
  if (!focusTrace && focus) document.getElementById("current-status").focus({preventScroll:true});
}
document.addEventListener("click", event => {
  const summary = event.target.closest("#table-trace > summary, #impact > summary");
  if (summary && !summary.parentElement.open) {
    const action = summary.parentElement.id === "impact" ? "inspect-impact" : "inspect";
    if (scenarios[state.scenario].steps[state.step]?.[0] === action) {
      event.preventDefault();
      act(action);
      return;
    }
  }
  const control = event.target.closest("button");
  if (!control) return;
  if (control.dataset.target) {
    const target = document.getElementById(control.dataset.target);
    const summary = target.querySelector(":scope > summary");
    if (summary && !target.open) summary.click();
    const updatedTarget = document.getElementById(control.dataset.target);
    (updatedTarget.querySelector(":scope > summary") || updatedTarget).focus();
    updatedTarget.scrollIntoView({block:"nearest"});
    return;
  }
  if (control.dataset.scenario) {
    state = create(control.dataset.scenario);
    render();
    document.querySelector('[aria-pressed="true"]').focus();
  }
  if (control.dataset.action) act(control.dataset.action);
  if (control.hasAttribute("data-guide")) {
    const [action] = scenarios[state.scenario].steps[state.step];
    const field = action === "ask" ? document.getElementById("question") :
      action === "record" ? document.getElementById("reason") :
      action === "confirm" ? document.getElementById("review-reason") : null;
    act(action, field?.value);
  }
});
document.addEventListener("submit", event => {
  event.preventDefault();
  const action = event.submitter?.value || event.target.dataset.form;
  act(action, new FormData(event.target).get("value") || "");
});
render();
</script>
</body>
</html>
