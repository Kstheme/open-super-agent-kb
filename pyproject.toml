[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkb"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "tomli>=2; python_version < '3.11'"]
description = "Local knowledge base and review evaluation harness"

[project.scripts]
openkb = "openkb.server.cli:main"

[tool.setuptools.packages.find]
include = ["openkb*"]
