[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkb"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "markdown-it-py>=3,<5",
    "pdfplumber>=0.11,<1",
    "tomli>=2; python_version < '3.11'",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]
description = "Local knowledge base and review evaluation harness"

[project.scripts]
openkb = "openkb.server.cli:main"

[tool.setuptools.packages.find]
include = ["openkb*"]

[tool.setuptools.package-data]
"openkb.server" = ["web_assets/templates/*.html", "web_assets/static/*"]
